services:
  db:
    image: postgres:16
    container_name: saas_odonto_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_odonto}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saas_odonto}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    container_name: saas_odonto_api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Opcional: só usado pelo rate limiter quando REDIS_URL está setada no seu
  # .env (senão o rate limiter roda in-memory, como sempre). Não conectado ao
  # `api` por padrão — para testar o caminho Redis localmente, adicione ao seu
  # .env: REDIS_URL=redis://redis:6379/0
  redis:
    image: redis:7-alpine
    container_name: saas_odonto_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
